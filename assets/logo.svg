<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="chemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Hive Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Hexagon -->
    <polygon points="40,5 72,23 72,60 40,78 8,60 8,23" 
             fill="none" stroke="url(#chemGrad)" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- Inner Molecular Network / Honeycomb Core -->
    <polygon points="40,18 60,30 60,53 40,65 20,53 20,30" 
             fill="#0f172a" stroke="url(#nodeGrad)" stroke-width="2.5" stroke-opacity="0.8" stroke-linejoin="round" />

    <!-- Connecting bonds to center -->
    <line x1="40" y1="41.5" x2="40" y2="18" stroke="#38bdf8" stroke-width="2" />
    <line x1="40" y1="41.5" x2="60" y2="53" stroke="#38bdf8" stroke-width="2" />
    <line x1="40" y1="41.5" x2="20" y2="53" stroke="#34d399" stroke-width="2" />

    <!-- Central & Vertex Atoms/Nodes -->
    <circle cx="40" cy="41.5" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="40" cy="18" r="3.5" fill="#10b981" />
    <circle cx="60" cy="30" r="3.5" fill="#38bdf8" />
    <circle cx="60" cy="53" r="3.5" fill="#10b981" />
    <circle cx="40" cy="65" r="3.5" fill="#38bdf8" />
    <circle cx="20" cy="53" r="3.5" fill="#10b981" />
    <circle cx="20" cy="30" r="3.5" fill="#38bdf8" />

    <!-- Mini satellite node -->
    <line x1="72" y1="23" x2="82" y2="17" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />
    <circle cx="82" cy="17" r="3" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(108, 22)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#0f172a">
      CHEM<tspan fill="url(#chemGrad)">HIVE</tspan>
    </text>
    <text x="2" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="3.2" fill="#64748b">
      GLOBAL CHEMICAL SUPPLY
    </text>
  </g>
</svg>
